<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <title>Niall Twomey</title>
    <meta
      name="description"
      content="Machine learning research lead. Publications, projects and notes on probabilistic modelling, healthcare sensing and recommendation."
    />

    <!-- Slack, WhatsApp and the rest read Open Graph and ignore `description`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Niall Twomey" />
    <meta property="og:title" content="Niall Twomey" />
    <meta
      property="og:description"
      content="Machine learning research lead. Publications, projects and notes on probabilistic modelling, healthcare sensing and recommendation."
    />
    <meta property="og:url" content="https://www.nialltwomey.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Niall Twomey" />
    <meta
      name="twitter:description"
      content="Machine learning research lead. Publications, projects and notes on probabilistic modelling, healthcare sensing and recommendation."
    />

    <!--
      Set the theme before first paint.

      React applies the same class, but it runs after the browser has already
      drawn the page — so without this a dark-mode reader gets a white flash on
      every load. Keep it inline and blocking; a deferred script is too late.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* private mode blocks localStorage — light is a fine default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
