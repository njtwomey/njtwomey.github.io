[project]
name = "nialltwomey-python"
version = "0.1.0"
description = "Scratch environment for the code that appears in notes on nialltwomey.com."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "skl2onnx>=1.18",
    "torch>=2.4",
]

[dependency-groups]
dev = ["ruff>=0.6"]

# Nothing here is packaged or imported by the site. It exists so that any code
# quoted in a note can actually be run before it is quoted, which is the only
# way to be sure the output in the note is the output the reader will get.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
